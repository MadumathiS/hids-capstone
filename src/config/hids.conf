# HIDS Configuration File
# This file contains all configuration settings for the HIDS system

# ============================================
# SYSTEM HEALTH MONITORING
# ============================================

# CPU Load Thresholds (in multiples of CPU cores)
CPU_LOAD_WARNING=2.0
CPU_LOAD_CRITICAL=4.0

# Memory Usage Thresholds (percentage)
MEMORY_USED_WARNING=80
MEMORY_USED_CRITICAL=95

# Disk Usage Thresholds (percentage)
DISK_USED_WARNING=80
DISK_USED_CRITICAL=95

# I/O Wait Thresholds (percentage)
IOWAIT_WARNING=40
IOWAIT_CRITICAL=70

# Process Count Thresholds
PROCESS_COUNT_WARNING=300
PROCESS_COUNT_CRITICAL=500

# ============================================
# USER ACTIVITY MONITORING
# ============================================

# Failed Login Detection
FAILED_LOGIN_THRESHOLD=5
FAILED_LOGIN_WINDOW_MINUTES=5

# Monitor these user IDs
MONITOR_UID_MIN=0
MONITOR_UID_MAX=1000

# ============================================
# NETWORK MONITORING
# ============================================

# Suspicious Ports to Monitor (space-separated)
# Common backdoor ports
SUSPICIOUS_PORTS="4444 5555 6666 7777 8888 9999 31337 6667"

# Allow legitimate services
LEGITIMATE_PORTS="22 80 443 3306 5432 8080 8443"

# ============================================
# FILE INTEGRITY MONITORING
# ============================================

# Critical Files to Monitor (space-separated)
MONITORED_FILES="/etc/passwd /etc/shadow /etc/sudoers /etc/ssh/sshd_config /root/.ssh/authorized_keys /bin/bash /usr/bin/sudo /bin/sh /bin/ls"

# Suspicious Locations (World-writable directories)
SUSPICIOUS_LOCATIONS="/tmp /var/tmp /dev/shm"

# SUID Files Threshold
MAX_SUID_FILES=50

# ============================================
# PROCESS MONITORING
# ============================================

# Suspicious Process Patterns
SUSPICIOUS_PROC_NAMES="nc ncat netcat sh bash perl python ruby"

# Prohibited Process Locations (world-writable)
PROHIBITED_PROC_LOCATIONS="/tmp:/var/tmp:/dev/shm"

# ============================================
# ROOTKIT DETECTION
# ============================================

# Monitor for rootkit indicators
CHECK_ROOTKITS="yes"

# Rootkit check methods
ROOTKIT_CHECK_CHKROOTKIT="yes"
ROOTKIT_CHECK_RKHUNTER="yes"

# ============================================
# ALERTING & LOGGING
# ============================================

# Alert Log File
ALERT_LOG="/var/lib/hids/alerts.log"

# Scan Results Log
SCAN_LOG="/var/lib/hids/scans.log"

# Baseline Directory
BASELINE_DIR="/var/lib/hids/baselines"

# Configuration File Location
CONFIG_FILE="/var/lib/hids/hids.conf"

# Log Rotation
LOG_ROTATION_SIZE_MB=100
LOG_ROTATION_KEEP_DAYS=30

# ============================================
# SEVERITY LEVELS
# ============================================

# CRITICAL: Immediate threat - requires immediate action
# HIGH: Likely threat - investigate within hours
# MEDIUM: Worth investigating - monitor closely
# LOW: Information only - for awareness

CRITICAL_ACTION="log_and_alert"
HIGH_ACTION="log_and_alert"
MEDIUM_ACTION="log_only"
LOW_ACTION="log_only"

# ============================================
# COLLECTION SETTINGS
# ============================================

# Collect system metrics
COLLECT_METRICS="yes"

# Metrics to collect
COLLECT_CPU="yes"
COLLECT_MEMORY="yes"
COLLECT_DISK="yes"
COLLECT_NETWORK="yes"
COLLECT_PROCESSES="yes"

# ============================================
# SCANNING SCHEDULE
# ============================================

# Scan frequency (in minutes, typically 5-10)
SCAN_INTERVAL=5

# Full system scan time window (24-hour format)
FULL_SCAN_HOUR=2

# ============================================
# BASELINE SETTINGS
# ============================================

# Create baseline on first run
CREATE_BASELINE_ON_FIRST_RUN="yes"

# Recalculate baseline
RECALCULATE_BASELINE_DAYS=7

# Baseline comparison sensitivity (0-100, higher = stricter)
BASELINE_SENSITIVITY=85

# ============================================
# REPORTING
# ============================================

# Email Alerts
SEND_EMAIL_ALERTS="no"
EMAIL_TO="admin@example.com"
EMAIL_FROM="hids@localhost"

# Syslog Alerts
SEND_SYSLOG_ALERTS="yes"
SYSLOG_SERVER="localhost"
SYSLOG_PORT=514

# ============================================
# PERFORMANCE
# ============================================

# Maximum time per scan (seconds)
MAX_SCAN_TIME=300

# Use caching for baseline comparisons
USE_CACHE="yes"
CACHE_TTL_MINUTES=30

# ============================================
# DEBUGGING
# ============================================

# Debug mode (yes/no)
DEBUG_MODE="no"

# Log level (ERROR, WARNING, INFO, DEBUG)
LOG_LEVEL="INFO"

# Verbose output
VERBOSE="no"

# ============================================
# EXCLUDE PATTERNS
# ============================================

# Exclude files/directories from monitoring (regex patterns)
EXCLUDE_PATHS="/proc /sys /dev /run /var/run /var/lock /var/cache"

# Exclude file types
EXCLUDE_EXTENSIONS=".bak .tmp .cache .log"

# ============================================
# SECURITY SETTINGS
# ============================================

# Require authentication for configuration changes
REQUIRE_SUDO="yes"

# Protect baseline files
PROTECT_BASELINES="yes"

# Protect alert logs
PROTECT_LOGS="yes"

# ============================================
# INTEGRATION SETTINGS
# ============================================

# Elasticsearch Integration
ELASTICSEARCH_ENABLED="yes"
ELASTICSEARCH_HOST="localhost"
ELASTICSEARCH_PORT="9200"
ELASTICSEARCH_INDEX="hids-alerts"

# Kibana Dashboard
KIBANA_ENABLED="yes"
KIBANA_HOST="localhost"
KIBANA_PORT="5601"

# ============================================
# CUSTOM RULES
# ============================================

# Add custom detection rules here
# Format: CUSTOM_RULE_NAME="condition_to_check"

CUSTOM_RULE_1="Monitor for netstat changes"
CUSTOM_RULE_2="Monitor for iptables changes"
CUSTOM_RULE_3="Monitor for cron job additions"

# ============================================
# NOTIFICATION SETTINGS
# ============================================

# Alert notifications
NOTIFY_ON_CRITICAL="yes"
NOTIFY_ON_HIGH="yes"
NOTIFY_ON_MEDIUM="no"

# Notification methods
NOTIFY_VIA_EMAIL="yes"
NOTIFY_VIA_SYSLOG="yes"
NOTIFY_VIA_WEBHOOK="no"
WEBHOOK_URL=""

# ============================================
# END OF CONFIGURATION
# ============================================
